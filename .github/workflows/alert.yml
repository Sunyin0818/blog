name: guard-and-alert

on:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build-time guard
        run: bash .ci/guard.sh

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          # Scan the working tree (not a git diff-range). Robust against
          # force-pushes / shallow clones where the "before" commit is orphaned.
          args: --no-git --source .
