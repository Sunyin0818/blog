baseURL: "https://blog.sunyin.fun/"   # Cloudflare Pages 自定义域（已上线）
title: "Sunyin 的笔记"
locale: zh-CN
defaultContentLanguage: zh
timeZone: Asia/Shanghai          # ★ 解决无时区 frontmatter
hasCJKLanguage: true             # ★ 中文 WordCount / Summary 正确
enableRobotsTXT: true
buildFuture: false

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
  # ★ 站点自建页（全部笔记 / 关于…）放在 content/ 之外的 site-pages/，再挂载进 content。
  #   原因：Obsidian Enveloppe 的 autoclean 只清理仓库的 content/ 目录，
  #   放这里就永远不会被误删 —— autoclean 可以保持全开（Actions 偶发失败时仍能自愈）。
  #   注意：一旦声明 mounts，只有 content 这个 target 的默认挂载被覆盖，
  #   static/layouts/assets/i18n 等仍走默认，无需重复声明。
  mounts:
    - source: content
      target: content
    - source: site-pages
      target: content

taxonomies:
  tag: tags
pagination:
  pagerSize: 12
frontmatter:
  lastmod:
    - lastmod
    - ":fileModTime"
    - date
outputs:
  home:
    - HTML
    - RSS
    - JSON            # ★ JSON 是客户端搜索（fuse.js）必需
sitemap:
  changefreq: weekly
  priority: 0.5

markup:
  goldmark:
    renderer:
      unsafe: true            # 笔记里有 <br> 等裸 HTML
      hardWraps: true         # 单个换行渲染为 <br>（引用/笔记里使换行可见）
    parser:
      attribute:
        block: true
    extensions:
      typographer:
        disable: true         # ★ 中文必关，否则引号/破折号被改写
  highlight:
    noClasses: false
    lineNos: false            # ★ 中文站开了移动端很难受
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
pygmentsUseClasses: true

params:
  env: production             # ★ 开 OG / Schema.org
  mainSections:
    - aio
    - ai
    - coding
    - linux
    - misc
    - crypto
  DateFormat: "2006-01-02"
  defaultTheme: auto
  ShowReadingTime: true
  ShowBreadCrumbs: true       # 面包屑 = 目录层级
  ShowToc: true
  ShowCodeCopyButtons: true
  ShowLastMod: true           # 配合自定义 post_meta.html
  comments: true
  assets:
    disableHLJS: true
  fuseOpts:                   # ★ 中文搜索调优
    threshold: 0.3
    minMatchCharLength: 1
    ignoreLocation: true
    keys:
      - title
      - permalink
      - summary
      - content
  profileMode:
    enabled: true
    title: "Sunyin"
    subtitle: "折腾 · 自托管 · 笔记"
    description: "天高云阔，风语如歌"
    imageUrl: ""          # 可选：放头像图（如 /avatar.jpg）后在此填写路径
    buttons:
      - name: 浏览笔记
        url: /notes/
  socialIcons:
    - name: github
      url: "https://github.com/Sunyin0818"
      title: GitHub
    - name: email
      url: "mailto:sunyinxx@gmail.com"
      title: Email
  giscus:
    repo: "Sunyin0818/blog-comments"   # giscus 评论仓库（owner/repo）
    repoId: "R_kgDOTr760Q"               # giscus.app 生成
    category: "Announcements"           # 讨论分类名（需与仓库 Discussions 中一致）
    categoryId: "DIC_kwDOTr760c4DCjJO"   # giscus.app 生成
    mapping: "pathname"                 # 评论与页面映射方式
    reactions: "1"                      # 是否显示反应按钮
  # 不配 editPost（会暴露 private 仓库路径）

menu:
  main:
    - { name: 标签,  url: /tags/,      weight: 85 }
    - { name: 搜索,  url: /search/,   weight: 99 }
